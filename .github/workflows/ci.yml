name: CI

on:
  # Push validation runs on `main` and on `pre-release/**` branches only. The `dev` branch is the
  # WIP scratchpad — lessons land file-by-file (brief, summary, practice,
  # cheatsheet, references separately) and the validator legitimately
  # fails on intermediate commits. PRs still run full validation, so the
  # merge gate is intact; this just stops the email storm on every WIP
  # push. A `pre-release/**` branch holds one frozen release candidate and
  # gets the full run on push.
  push:
    branches: [main, 'pre-release/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit hash; the comment names the release.
# A moving tag can be repointed to different code without any change here.

# Runners are PINNED to ubuntu-24.04, not `ubuntu-latest`.
#
# On 2026-11-07 GitHub rolled the `ubuntu-latest` label from ubuntu-24.04
# to ubuntu-26.04 mid-day. Proven from the runner logs: the 02:31 UTC run
# on 22faaf3 reports `Image: ubuntu-24.04` and passed 4/4; the 14:38 UTC
# run on eadb17b reports `Image: ubuntu-26.04` and the e2e job died at
# browser install with
#
#   ERROR: Playwright does not support chromium on ubuntu26.04-x64
#
# Nothing in the repo changed between those two runs. @playwright/test is
# pinned at ^1.59.1, which has no chromium build for 26.04, so every e2e
# run on the new image fails before a single test executes.
#
# All three jobs are pinned, not just e2e, so the next image roll cannot
# silently change what we build and link-check either. This is the exact
# environment that was already green.
#
# FOLLOW-UP: upgrade @playwright/test to a release that supports 26.04,
# re-verify the suite, then decide whether to unpin. Deliberately NOT done
# in this change: an in-range dependency bump is what broke GFM for .mdx
# earlier today, so the dependency move gets its own PR and its own
# verification rather than riding along with a CI unblock.
jobs:
  build-and-validate:
    name: Build, typecheck, validate content
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history on purpose. astro.config.mjs derives each lesson
          # artifact's sitemap lastmod from the last commit touching its .mdx.
          # actions/checkout defaults to fetch-depth: 1, a shallow clone, which
          # collapses every file onto one commit; the shallow guard then
          # suppresses lastmod entirely and CI would never exercise the real
          # path. See scripts/check-sitemap-lastmod.ts.
          fetch-depth: 0

      # Node is required by `astro check`, `astro build`, and `astro preview`,
      # which Bun-run scripts shell out to. Astro requires Node >=22.12.
      # Version pinned in .nvmrc for one source of truth.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Security gate runs BEFORE the content validators: it must not be
      # masked when a content validator (e.g. reading-level) fails first,
      # since CI stops at the first failing step.
      - name: Validate no PVC voice-ID leak
        run: bun run validate:voice-id

      - name: Validate content schema
        run: bun run validate:content

      - name: Validate attribution blocks
        run: bun run validate:attribution

      - name: Validate podcast coverage (narrated lessons in the feeds)
        run: bun run validate:podcast-coverage

      # SEO gates run BEFORE reading-level so the pre-existing reading-level
      # red does not mask them (CI stops at the first failing step).
      - name: Validate meta-description length (SEO, indexed artifacts)
        run: bun run validate:meta-length

      - name: Validate title length (SEO, indexed artifacts)
        run: bun run validate:title-length

      - name: Validate reading level (Flesch Reading Ease)
        run: bun run validate:reading-level

      # Fails if any shipped narration speaks an internal production note aloud.
      # Source greps cannot catch this: once a placeholder comment is replaced by
      # a real diagram the comment leaves the .mdx while the stale MP3 keeps
      # narrating it. Reads the read-along timing JSON, which is what the voice
      # actually said. 24 lessons shipped this defect for four months.
      - name: Validate narration integrity (no internal notes in audio)
        run: bun run validate:narration -- --strict

      # Fails on a code fence that opens while another is still open and carries
      # an info string (```python inside ```yaml). Markdown cannot nest
      # same-length fences, so the inner one becomes literal content and the
      # next bare ``` closes the outer block early. agent-skills-and-claude-code
      # shipped that way: ~42% of its body rendered inside one <pre> with a
      # heading buried in it, and its read-along ran 980 words out of sync.
      # astro build accepted it, because the MDX was still valid.
      - name: Validate code-fence pairing
        run: bun run validate:fences

      # Fails when a lesson's audio was built from a different number of words
      # than the page now shows. The read-along walker maps DOM word N to
      # words[N], so a count mismatch does not throw: the highlight just drifts
      # further behind as the lesson plays, and the clamp hides the overflow.
      # A CHARACTER-only difference does not fail. 176 lessons drift 1 to 30
      # chars with word counts intact, because the prose extractor was refined
      # after those renders, and no highlight index moves. Armed 2026-11-01, in
      # the same change that closed the last of the 13 word mismatches.
      - name: Validate read-along timing matches the page
        run: bun run validate:readalong-sync

      # Unit tests for pure logic, no browser and no build needed. The
      # freshness date rules live here rather than in the Playwright spec
      # because the spec used to assert a real lesson's "Recently updated"
      # callout, which was green for thirty days after that lesson's review
      # and then went red on its own with nothing in the code changing.
      - name: Unit tests
        run: bun run test:unit

      - name: Build site (includes Pagefind index)
        run: bun run build

      # Reads the BUILT sitemap. Fails if lastmod is present but near-uniform,
      # which is worse than absent (it trains crawlers to ignore the field).
      # Absent lastmod passes with a warning: that is the legitimate
      # shallow-clone fallback. Requested by SEO Specialist 2026-10-26.
      - name: Validate sitemap lastmod carries information
        run: bun run validate:sitemap-lastmod

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          # dist/.well-known/security.txt is a DOTFILE directory. upload-artifact
          # excludes hidden files by default, so the link-check job downloaded a
          # dist with no .well-known/ and reported our own security.txt as a
          # broken link. The file was never missing from the site.
          include-hidden-files: true

  link-check:
    name: Check links in built site
    runs-on: ubuntu-24.04
    needs: build-and-validate
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir is required so lychee can resolve root-relative links
          # (href="/", href="/mission/") in built HTML against the local dist
          # tree instead of treating them as unresolvable.
          args: >-
            --config .github/lychee.toml
            --root-dir "$GITHUB_WORKSPACE/dist"
            --no-progress
            './dist/**/*.html'
          fail: true

  # One job per browser project, so each engine installs only its own browser,
  # fits the time-out, and uploads its own screenshots. The projects are
  # defined in playwright.config.ts; tests/cross-browser.spec.ts saves a
  # full-page screenshot per check, uploaded below for a person to look at.
  e2e:
    name: Playwright e2e tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    needs: build-and-validate
    timeout-minutes: 20
    # Playwright's own image, pinned by digest. It ships every browser with
    # the system packages they need. Installing those on the runner at run
    # time meant about 126 MB from the runner's package mirror, which was
    # often slow enough to use up the whole job limit before a test ran.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.64.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node is required by `astro preview` (started by the Playwright config
      # before tests run). Astro requires Node >=22.12.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reuse the artifact built by build-and-validate so astro preview has
      # something to serve. Avoids rebuilding in every matrix job.
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-${{ github.sha }}
          path: dist/

      # The browsers and their system packages are already in the container
      # image, so nothing is installed here. The image only works with the
      # exact Playwright version it was built for; fail with a clear message if
      # the package was upgraded and the image tag above was not.
      - name: Check the container matches the Playwright version
        run: |
          want="$(bunx playwright --version | awk '{print $2}')"
          if [ "$want" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $want but the container image is v$PLAYWRIGHT_IMAGE_VERSION. Update the image tag and digest in ci.yml."
            exit 1
          fi

      - name: Run e2e tests
        run: bunx playwright test --project=${{ matrix.project }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: screenshots-${{ matrix.project }}-${{ github.sha }}
          path: test-results/screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
