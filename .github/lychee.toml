# Lychee link checker config — runs in CI on the built site.
# Docs: https://lychee.cli.rs/usage/config/

# Verbosity level
verbose = "info"

# Same-page anchors are NOT checked, which is what we want.
# There is deliberately no include_fragments key here: upstream changed it from
# a boolean to a string, so `include_fragments = false` fails config parsing and
# lychee exits 3 before checking a single link. Omitting it gives the same
# behavior as the old `false`, because lychee only checks fragments on request.
# Do not re-add the key.

# Treat 429 (rate limited) as ok — some sites throttle CI runners
accept = ["100..=103", "200..=299", "429"]

# Skip links that are commonly flaky in CI but valid in practice
exclude = [
  # localhost/127.0.0.1 references in code samples
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  # GitHub anchor-edit URLs (we don't generate these but guard anyway)
  "^https?://github\\.com/.+/edit/",
  # Mailto and tel
  "^mailto:",
  "^tel:",
  # LinkedIn returns HTTP 999 to non-browser user agents as a bot deterrent;
  # the URL itself is fine, but CI cannot distinguish 999 from a real failure.
  "^https?://(www\\.)?linkedin\\.com/",
  # Publishers and vendors that serve 403 to every automated client. Verified
  # 2026-10-31 by curling each with a full desktop browser user agent: still
  # 403, so the block is JS/bot-detection, not a dead URL. Spot-checked
  # dl.acm.org, openai.com and science.org directly. These are cited sources
  # and must stay in the lessons; only CI's ability to fetch them is in doubt.
  # Do NOT add a domain here without curling it first. A 404 is never a
  # candidate for this list.
  "^https?://dl\\.acm\\.org/",
  "^https?://(www\\.)?sciencedirect\\.com/",
  "^https?://(www\\.)?pnas\\.org/",
  "^https?://(www\\.)?science\\.org/",
  "^https?://academic\\.oup\\.com/",
  "^https?://openreview\\.net/",
  "^https?://(www\\.)?mdpi\\.com/",
  "^https?://openai\\.com/",
  "^https?://(www\\.)?canlii\\.org/",
  "^https?://(www\\.)?consilium\\.europa\\.eu/",
  "^https?://(www\\.)?goldmansachs\\.com/",
  "^https?://(www\\.)?gspublishing\\.com/",
  "^https?://(www\\.)?hrdive\\.com/",
  "^https?://(www\\.)?lullabot\\.com/",
  "^https?://(www\\.)?theladders\\.com/",
  "^https?://(www\\.)?gizmodo\\.com/",
  "^https?://(www\\.)?searchengineland\\.com/",
  "^https?://docs\\.gitlab\\.com/",
  "^https?://(www\\.)?cloudflare\\.com/learning/",
  "^https?://deepmindsafetyresearch\\.medium\\.com/",
  # News sites that hang on a non-browser user agent rather than answering.
  # Verified 2026-10-31: with lychee's own UA both return nothing at all (curl
  # exit 28 after 45 seconds on HTTP/1.1 and on HTTP/2, which is the
  # "HTTP/2 protocol error" lychee reports); with a full desktop browser UA
  # both return 200 in under two seconds. UA gating, not dead URLs. These are
  # the only links to either host in the repo.
  "^https?://(www\\.)?npr\\.org/",
  "^https?://(www\\.)?cbc\\.ca/",
  # The LLM leaderboard formerly at chat.lmsys.org. lmarena.ai 301s to
  # arena.ai, and arena.ai serves 403 to every automated client; verified
  # 2026-10-31 with a full desktop browser UA, still 403, so it is Cloudflare
  # bot detection and not a dead URL. The citable methodology source is the
  # Chatbot Arena paper (arXiv 2403.04132), which CI can fetch.
  "^https?://(www\\.)?arena\\.ai/",
  "^https?://(www\\.)?lmarena\\.ai/",
  # POST-only endpoint. A GET correctly returns 405; it is documentation, not
  # a link a reader follows.
  "^https?://api\\.anthropic\\.com/",
  # Self-canonicals to clawdemy.org point at production. New lessons land on
  # `dev` first and only reach prod after a main merge, so on the first dev
  # push the canonical 404s. We already verify the same pages locally via
  # file:// when lychee crawls the built dist; checking the production URL
  # adds nothing but a deploy-order race.
  "^https?://clawdemy\\.org/",
  # Stanford's CME 295 course site rejects CI user-agents with 403 (likely a
  # WAF / bot deterrent). The URL itself is valid and is the canonical Stanford
  # citation for the AI Foundations track; CI cannot distinguish a WAF 403
  # from a real broken link.
  "^https?://cme295\\.stanford\\.edu/",
  # Audio MP3s are R2-hosted and generated at production-deploy time, not at
  # draft time (see Doc/governance/lesson-pipeline-agents.md "Audio policy").
  # New lessons land on dev with the AudioPlayer wired up but the MP3 not yet
  # rendered; the URL 404s until `bun run audio:generate <slug>` runs as part
  # of the production-deploy step. Audio URL validity is a deploy-order
  # concern, not a content-correctness concern, so lychee skips this surface.
  "^https?://audio\\.clawdemy\\.org/",
]

# Network politeness
max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2

# User agent so sites don't think we're a malicious crawler
user_agent = "Mozilla/5.0 (compatible; Clawdemy-CI-LinkCheck/1.0; +https://clawdemy.org)"

# Cache results across runs to speed up CI
cache = true
max_cache_age = "24h"
